<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48" role="img" aria-label="SiteLedger">
  <title>SiteLedger</title>

  <!-- Mark: a plumb line (site) crossed by three ledger rows (record).
       Scales cleanly to 16px when the wordmark is dropped. -->
  <g>
    <!-- plumb line -->
    <rect x="6" y="6" width="4" height="36" rx="2" fill="#1B4965"/>
    <!-- plumb bob -->
    <circle cx="8" cy="42" r="4" fill="#1B4965"/>
    <!-- ledger rows -->
    <rect x="16" y="11" width="26" height="5" rx="2.5" fill="#1B4965"/>
    <rect x="16" y="21" width="18" height="5" rx="2.5" fill="#5A6B7A"/>
    <rect x="16" y="31" width="30" height="5" rx="2.5" fill="#0F7B4F"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="32"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="24"
        letter-spacing="-0.4">
    <tspan fill="#17212B" font-weight="600">Site</tspan><tspan fill="#1B4965" font-weight="400">Ledger</tspan>
  </text>
</svg>
